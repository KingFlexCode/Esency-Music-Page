<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../styles/blog-common.css">
  <link rel="stylesheet" href="../styles/styles-blog.css">
  <title>Esency Blog Page</title>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo"><a href="../pages/home.html">ESENCY</a> • BLOG</div>
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 21l-4.3-4.3" stroke="#b7b7b7" stroke-width="2" stroke-linecap="round"/><circle cx="11" cy="11" r="7" stroke="#b7b7b7" stroke-width="2" fill="none"/></svg>
        <input id="search" placeholder="Search posts, tags, months…" />
      </div>
    </header>

    <main>
      <aside class="sidebar">
        <div class="archive">
          <h3>Archive (by Month)</h3>
          <div id="archive"></div>
        </div>
      </aside>

      <section>
        <div class="filters" id="activeFilters"></div>
        <div id="posts" class="posts"></div>
      </section>
    </main>

    <footer>
      © <span id="year"></span> Esency Music Records.
    </footer>
  </div>
  <script src="../scripts/blog-main.js"></script>
  <script src="../scripts/share.js"></script>

</body>
</html>
