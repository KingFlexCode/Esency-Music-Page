<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart - Esency</title>
  <link rel="stylesheet" href="../styles/styles.css" />
  <style>
    .cart-wrap {max-width: 960px; margin: 40px auto; padding: 0 16px;}
    .cart-table {width: 100%; border-collapse: collapse; margin-bottom: 16px;}
    .cart-table th, .cart-table td {padding: 12px; border-bottom: 1px solid #222;}
    .qty-btn {padding: 4px 10px; border: 1px solid #444; background:#111; color:#fff; border-radius:6px; cursor: pointer;}
    .remove-btn {border:none; background:transparent; color:#f66; cursor:pointer;}
    .totals {display:flex; justify-content:flex-end; gap:24px; font-weight:700; margin: 16px 0;}
    .checkout-container {display:flex; justify-content:flex-end; margin: 24px 0;}
    .empty {text-align:center; padding: 40px 0; opacity: 0.8;}
  </style>
</head>
<body>
  <header class="nav-header">
    <h1 class="esency-logo"><a href="./home.html">ESENCY</a></h1>
    <nav class="nav-bar">
      <a href="./home.html">Home</a>
      <a href="./blog.html">Blog</a>
      <a href="./merch.html">Merch</a>
      <a href="./music.html">Music</a>
      <a href="./videos.html">Videos</a>
      <a href="./links.html">Links</a>
      <a href="./bio.html">Bio</a>
      <a href="./contact.html">Contact</a>
      <a href="./cart.html" id="cart-button" class="cart-link">🛒 Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <main class="cart-wrap">
    <h1>Your Cart</h1>

    <table class="cart-table" id="cart-table" style="display:none;">
      <thead>
        <tr>
          <th style="text-align:left;">Item</th>
          <th>Size</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Total</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cart-rows"></tbody>
    </table>

    <p id="empty" class="empty">Your cart is empty.</p>

    <div class="totals" id="totals" style="display:none;">
      <div>Subtotal: $<span id="subtotal">0.00</span></div>
    </div>

    <div class="checkout-container" id="checkout" style="display:none;">
      <div id="paypal-button-container"></div>
    </div>
    <div class="checkout-container" style="margin: 24px 0;">
  <button id="printify-test-btn"
          style="padding:12px 16px;border:none;border-radius:8px;font-weight:700;background:#111;color:#fff;cursor:pointer;">
    Send to Printify (Test)
  </button>
</div>

  </main>

  <footer>
    <p>&copy; 2025 Esency. All rights reserved.</p>
  </footer>

  <!-- PayPal JS SDK (use SANDBOX while testing; switch to Live when ready) -->
  <script src="https://www.paypal.com/sdk/js?client-id=AQH2Ku3FflhcXZiE93-33wunMJIZERUtZfRvKGN8TGpo4MsGXTs4X7mmBI3zqoBrBf5PAQnrMCEuDgZY&currency=USD"></script>

  <script>
  // ---------------- CART STATE ----------------
  let cart = JSON.parse(localStorage.getItem('cart') || '[]');
  const cartCount = () => cart.reduce((s, i) => s + i.quantity, 0);
  const save = () => localStorage.setItem('cart', JSON.stringify(cart));
  document.getElementById('cart-count').textContent = cartCount();

  // ---------------- PRODUCT MAP (single source of truth) ----------------
  window.PRODUCT_MAP = {
    'white-tee': {
      label: 'Nada Personal Red Lips T-shirt (White)',
      product_id: '616b53408c0a6c6ee86808c0',
      variants: { S:17643, M:17644, L:17645, XL:17646, XXL:17647 }
    },
    'red-tee': {
      label: 'Nada Personal Red Lips T-shirt (Red)',
      product_id: '616b53408c0a6c6ee86808c0',
      variants: { S:17589, M:17590, L:17591, XL:17592, XXL:17593 }
    },

    // placeholders for later
    'grey-tee':     { label: 'Grey T-shirt',  product_id: '', variants: { S:null,M:null,L:null,XL:null,XXL:null } },
    'black-hoodie': { label: 'Black Hoodie',  product_id: '', variants: { S:null,M:null,L:null,XL:null,XXL:null } },
    'white-hoodie': { label: 'White Hoodie',  product_id: '', variants: { S:null,M:null,L:null,XL:null,XXL:null } },
    'grey-hoodie':  { label: 'Grey Hoodie',   product_id: '', variants: { S:null,M:null,L:null,XL:null,XXL:null } }
  };

  // convenience alias
  const PRODUCT_MAP = window.PRODUCT_MAP;

  // ---------------- DOM HOOKS ----------------
  const $rows = document.getElementById('cart-rows');
  const $table = document.getElementById('cart-table');
  const $empty = document.getElementById('empty');
  const $totals = document.getElementById('totals');
  const $subtotal = document.getElementById('subtotal');
  const $checkout = document.getElementById('checkout');

  // ---------------- RENDER ----------------
  function render() {
    if (!cart.length) {
      $table.style.display = 'none';
      $totals.style.display = 'none';
      $checkout.style.display = 'none';
      $empty.style.display = 'block';
      document.getElementById('cart-count').textContent = '0';
      return;
    }

    $empty.style.display = 'none';
    $table.style.display = '';
    $totals.style.display = '';
    $checkout.style.display = '';

    $rows.innerHTML = cart.map((i, idx) => `
      <tr>
        <td style="text-align:left;">${i.name}</td>
        <td style="text-align:center;">${i.size || '-'}</td>
        <td style="text-align:center;">$${i.price.toFixed(2)}</td>
        <td style="text-align:center;">
          <button class="qty-btn" data-idx="${idx}" data-op="-">–</button>
          <span style="display:inline-block; min-width:24px; text-align:center;">${i.quantity}</span>
          <button class="qty-btn" data-idx="${idx}" data-op="+">+</button>
        </td>
        <td style="text-align:center;">$${(i.price * i.quantity).toFixed(2)}</td>
        <td style="text-align:center;"><button class="remove-btn" data-remove="${idx}">Remove</button></td>
      </tr>
    `).join('');

    const total = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
    $subtotal.textContent = total.toFixed(2);
    document.getElementById('cart-count').textContent = cartCount();
  }
  render();

  // ---------------- QTY / REMOVE EVENTS ----------------
  document.body.addEventListener('click', (e) => {
    const minus = e.target.matches('.qty-btn[data-op="-"]');
    const plus  = e.target.matches('.qty-btn[data-op="+"]');
    const remove = e.target.matches('[data-remove]');

    if (minus || plus) {
      const idx = Number(e.target.getAttribute('data-idx'));
      cart[idx].quantity += plus ? 1 : -1;
      if (cart[idx].quantity <= 0) cart.splice(idx, 1);
      save(); render();
    }

    if (remove) {
      const idx = Number(e.target.getAttribute('data-remove'));
      cart.splice(idx, 1);
      save(); render();
    }
  });

  // ---------------- MAP CART -> PRINTIFY ITEMS ----------------
  function mapCartToPrintifyItems(cartItems) {
    const out = [];
    for (const i of cartItems) {
      const key  = (i.productId || '').trim();
      const sizeIn = (i.size || '').toUpperCase();
      const size = sizeIn === '2XL' ? 'XXL' : sizeIn; // normalize
      const map = PRODUCT_MAP[key];

      if (!map) { console.warn('No product map for:', key, i); continue; }
      const variantId = map.variants?.[size];
      if (!variantId) { console.warn('No variant for:', key, 'size:', size, i); continue; }

      out.push({
        product_id: map.product_id || undefined,
        variant_id: Number(variantId),
        quantity: Number(i.quantity || 1)
      });
    }
    return out;
  }

  // ---------------- TEST BUTTON -> DRAFT ORDER ----------------
    const testBtn = document.getElementById('printify-test-btn');
    if (testBtn) {
      testBtn.addEventListener('click', async () => {
        try {
          const items = mapCartToPrintifyItems(cart);
          if (!items.length) { alert('Add a White or Red tee with a size first.'); return; }

          const customer = {
            first_name: 'Test', last_name: 'Buyer', email: 'test@example.com',
            address1: '123 Main St', city: 'Bronx', region: 'NY', zip: '10467', country: 'US'
          };

          const resp = await fetch('/.netlify/functions/create-printify-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items, customer, send_to_production: true })
          });
          const data = await resp.json();
          console.log('Printify (test) response:', data);

          if (resp.ok && (data.created?.id)) {
            const sent = data.sent_to_production;
            if (sent?.id || sent?.status === 'submitted' || sent?.status === 'pending') {
              alert('✅ Order sent to production!\nOrder ID: ' + data.created.id);
            } else if (sent && (sent.error || sent.message)) {
              alert('✅ Draft created, but not sent to production:\n' + JSON.stringify(sent));
            } else {
              alert('✅ Draft created (not sent to production).\nOrder ID: ' + data.created.id);
            }
          } else {
            alert('❌ Error from Printify:\n' + (data.message || JSON.stringify(data)));
          }
        } catch (err) {
          console.error(err);
          alert('Unexpected error. See console.');
        }
      });
    }


  // ---------------- PAYPAL BUTTONS ----------------
  paypal.Buttons({
    createOrder: function (data, actions) {
      const total = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
      return actions.order.create({
        application_context: { shipping_preference: 'GET_FROM_FILE' },
        purchase_units: [{ amount: { value: total.toFixed(2) } }]
      });
    },

    onApprove: async function (data, actions) {
      const order = await actions.order.capture();

      // Buyer + shipping from PayPal
      const pu = (order.purchase_units && order.purchase_units[0]) || {};
      const ship = pu.shipping || {};
      const address = ship.address || {};
      const fullName = (ship.name && ship.name.full_name) ||
                      (order.payer && (order.payer.name?.given_name + ' ' + order.payer.name?.surname)) ||
                      'Esency Fan';
      const [first_name, ...rest] = fullName.split(' ');
      const last_name = rest.join(' ') || 'Customer';

      // Build Printify items using the global map
      const items = mapCartToPrintifyItems(cart);
      if (!items.length) { alert('Missing variant mapping. Add White/Red tee or update map.'); return; }

      const orderData = {
        orderId: order.id,
        customer: {
          first_name, last_name,
          email: order.payer?.email_address || '',
          phone: '',
          address1: address.address_line_1 || '',
          address2: address.address_line_2 || '',
          city:    address.admin_area_2 || '',
          region:  address.admin_area_1 || '',
          zip:     address.postal_code || '',
          country: address.country_code || 'US'
        },
        items,
        send_to_production: true
      };

      const resp = await fetch('/.netlify/functions/create-printify-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
      });

      const result = await resp.json();
      console.log('Printify response:', result);

      if (resp.ok && (result.created?.id)) {
        const sent = result.sent_to_production;
        if (sent?.id || sent?.status === 'submitted' || sent?.status === 'pending') {
          localStorage.removeItem('cart');
          window.location.href = './thankyou.html';
        } else if (sent && (sent.error || sent.message)) {
          alert('✅ Draft created, but not sent to production:\n' + JSON.stringify(sent));
        } else {
          // Draft only
          localStorage.removeItem('cart');
          window.location.href = './thankyou.html';
        }
      } else {
        alert('Payment captured, but failed to send order to Printify:\n' + (result.message || JSON.stringify(result)));
      }
    },

    onError: function (err) {
      console.error('PayPal error', err);
      alert('Checkout error. Please try again.');
    }
  }).render('#paypal-button-container');
  </script>


</body>
</html>
