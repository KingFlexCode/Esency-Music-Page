<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Esency Contact Page</title>
  <link rel="stylesheet" href="../styles/styles.css">
</head>
<body class="contact-background">
  <header class="nav-header">
    <h1 class="esency-logo"><a href="./home.html">ESENCY</a></h1>
    <nav class="nav-bar">
      <a href="./home.html">Home</a>
      <a href="./blog.html">Blog</a>
      <a href="./merch.html">Merch</a>
      <a href="./music.html">Music</a>
      <a href="./videos.html">Videos</a>
      <a href="./links.html">Links</a>
      <a href="./bio.html">Bio</a>
      <a href="./contact.html" class="active" aria-current="page">Contact</a>
    </nav>
  </header>
<main>
    <div class="contact-form">
      <form 
        action="mailto:esencymusic@gmail.com" 
        method="POST" 
        enctype="text/plain"
        netlify>

        <div class="form-header">
          <h2>Contact Esency</h2>
          <p>For collaberations, questions, or booking inquiries.</p>
        </div>

        <!-- Email -->
        <label for="email">Email</label>
        <input type="email" id="email" name="Email" placeholder="Your-email@gmail.com..." required>

        <!-- Phone -->
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="Phone" placeholder="(718)-111-1111" required>

        <!-- Reason Dropdown -->
        <label for="reason">Reason for Contact:</label>
        <select id="reason" name="Reason" required>
          <option value="" disabled selected>Select a reason</option>
          <option value="Booking Inquiry">Booking Inquiry</option>
          <option value="Collaboration">Collaboration</option>
          <option value="General Question">General Question</option>
          <option value="Featuring Proposal">Featuring Proposal</option>
          <option value="Media or Interview">Media or Interview Request</option>
          <option value="Other">Other</option>
        </select>

        <!-- Subject -->
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="Subject" placeholder="Your subject here..." required>

        <!-- Message -->
        <label for="message">Your Message</label>
        <textarea id="message" name="Message" placeholder="Type your message here..." rows="10" required></textarea>

        <!-- Optional link -->
        <label for="link">(Optional): Share a Link to Song</label>
        <input type="url" id="link" name="Link" placeholder="https://yourlink.com">

        <!-- Submit -->
        <button class="contact-submit-btn" type="submit">Submit</button>
      </form>
    </div>
</main>
  <footer>
    <p>&copy; 2025 Esency. All rights reserved.</p>
  </footer>
</body>
</html>
