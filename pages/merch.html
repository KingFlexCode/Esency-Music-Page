    .size-row {

    .size-row select {

    .merch-item button {

      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      background: #111;
      color: #fff;
      transition: background 0.3s ease;
    }
    .merch-item button:hover {

  <footer>
    <p>&copy; 2025 Esency. All rights reserved.</p>
  </footer>

  <script>
    // Load cart from localStorage
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    document.getElementById('cart-count').textContent = cart.length;

    function addToCart(productId, name, price, size) {
      // Check if item with same size already in cart -> increase quantity
      let existing = cart.find(item => item.productId === productId && item.size === size);
      if (existing) {
        existing.quantity += 1;
      } else {
        cart.push({ productId, name, price, size, quantity: 1 });
      }
      localStorage.setItem('cart', JSON.stringify(cart));
      document.getElementById('cart-count').textContent = cart.reduce((sum, i) => sum + i.quantity, 0);
    }
    
    function showToast(message = "Added to cart.") {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.style.opacity = "1";
      toast.style.transform = "translateY(0)";
      
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(20px)";
      }, 2000); // Toast will disappear after 2 seconds
    }

    document.body.addEventListener("click", (e) => {
      if (e.target.tagName.toLowerCase() !== "button") return;

      const item = e.target.closest(".merch-item");
      if (!item) return;

      const productId = item.dataset.id;
      const name = item.querySelector(".product-name").textContent.trim();
      const price = parseFloat(item.dataset.price);
      const size = item.querySelector("select[name='size']").value;

      if (!size) {
        alert("Please select a size first.");
        return;
      }

      addToCart(productId, name, price, size);
      showToast(`${name} (${size}) added to cart.`);
    });
  </script>
  <div id="toast" style="
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: #111;
        color: white;
        padding: 12px 18px;
        border-radius: 6px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        font-weight: bold;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease, transform 0.5s ease;
        z-index: 9999;
      ">
        Added to cart.
  </div>
</body>
