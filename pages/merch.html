<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Esency Merch</title>
  <link rel="stylesheet" href="../styles/styles.css" />
  <link rel="stylesheet" href="../styles/styles-merch.css" />
</head>
<body>
  <!-- HEADER -->
  <header class="nav-header">
    <h1 class="esency-logo"><a href="./home.html">ESENCY</a></h1>
    <nav class="nav-bar">
      <a href="./home.html">Home</a>
      <a href="./blog.html">Blog</a>
      <a href="./merch.html" class="active" aria-current="page">Merch</a>
      <a href="./music.html">Music</a>
      <a href="./videos.html">Videos</a>
      <a href="./links.html">Links</a>
      <a href="./bio.html">Bio</a>
      <a href="./contact.html">Contact</a>
      <a href="./cart.html" id="cart-button" class="cart-link">🛒 Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <!-- MAIN -->
  <main>
    <h1 style="text-align:center; margin-top: 2rem;">MERCH</h1>
    <div class="filter-container">
      <button class="filter-btn active" data-category="all">All</button>
      <button class="filter-btn" data-category="hoodie">Hoodies</button>
      <button class="filter-btn" data-category="hat">Hats</button>
      <button class="filter-btn" data-category="t-shirt">T-Shirts</button>
    </div>
    <div id="product-list"></div>
  
    <section id="merch-section">
      <!-- ✅ Container for JS to inject products -->
      <div class="product-grid"></div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2025 Esency. All rights reserved.</p>
  </footer>

  <!-- TOAST -->
  <div id="toast" class="toast">Added to cart.</div>

  <!-- Scripts -->
  <script type="module" src="../scripts/cart-utils.js"></script>
  <script type="module" src="../scripts/merch.js"></script>

</html>
