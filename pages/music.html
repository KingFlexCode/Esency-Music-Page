<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Esency Music Page</title>
  <link rel="stylesheet" href="../styles/styles.css"/>
  <link rel="stylesheet" href="../styles/styles-mobile.css" />
  <link rel="stylesheet" href="../styles/music-styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="music-background">
  <header class="nav-header">
    <h1 class="esency-logo"><a href="./home.html">ESENCY</a></h1>
    
    <!-- HAMBURGER BUTTON (only visible on mobile) -->
    <button class="burger" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav-bar-music">
      <a href="./home.html">Home</a>
      <a href="./blog.html">Blog</a>
      <a href="./merch.html">Merch</a>
      <a href="./music.html" class="active" aria-current="page">Music</a>
      <a href="./videos.html">Videos</a>
      <a href="./links.html">Links</a>
      <a href="./bio.html">Bio</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </header>
  <main>
  <section class="music-wrap">
    <div class="playlist-header">
      <div class="playlist-cover">
        <img src="../assets/covers/default.jpg" alt="Playlist Cover" class="cover-img" />
      </div>
      <div class="playlist-info">
        <p>Playlist</p>
        <h1>Liked Songs</h1>
        <div class="playlist-meta">
          <img src="../assets/images/esency-profile.jpg" alt="Esency" class="artist-avatar" />
          <span>Esency • <span id="song-count">3 songs</span></span>
        </div>
      </div>
    </div>

    <div class="player-controls">
      <button id="play-btn"><i class="fa-solid fa-play"></i></button>
      <button id="shuffle-btn"><i class="fa-solid fa-shuffle"></i></button>
      <button id="download-btn"><i class="fa-solid fa-download"></i></button>
    </div>

    <div class="genre-tags">
      <button class="tag">Reggaeton</button>
      <button class="tag">Dancehall</button>
      <button class="tag">Latin</button>
      <button class="tag">Chill</button>
    </div>

    <ul id="playlist" class="playlist-table"></ul>
  </section>
  <script type="module" src="../scripts/music-player.js"></script>
  <script src="../scripts/nav-toggle.js"></script>

</body>
</html>
