<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Esency Music Page</title>
  <link rel="stylesheet" href="../styles/muisc-styles.css" />
  <link rel="stylesheet" href="../styles/styles.css"/>
</head>
<body class="music-background">
  <header class="nav-header">
    <h1 class="esency-logo"><a href="./home.html">ESENCY</a></h1>
    <nav class="nav-bar-music">
      <a href="./home.html">Home</a>
      <a href="./blog.html">Blog</a>
      <a href="./merch.html">Merch</a>
      <a href="./music.html" class="active" aria-current="page">Music</a>
      <a href="./videos.html">Videos</a>
      <a href="./links.html">Links</a>
      <a href="./bio.html">Bio</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </header>
<main>
  <section class="music-wrap">
    <h1>Music</h1>
    <div class="player">
      <div class="now-playing">
        <img class="cover-art" src="../assets/covers/default.jpg" alt="Cover" />
        <div>
          <h3 id="track-title">Track Title</h3>
          <div id="track-artist">Artist Name</div>
          <div class="controls">
            <button id="prev-btn">Prev</button>
            <button id="play-btn">Play</button>
            <button id="next-btn">Next</button>
          </div>
          <div class="timeline">
            <input type="range" id="progress-bar" min="0" max="100" step="1" value="0" />
          </div>
        </div>
      </div>
    </div>
    <ul class="playlist" id="playlist"></ul>
  </section>
</main>
>
</html>
